[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-mcp-agent"
version = "0.1.0"
description = "Azure Resource Guide Agent - Azure MCP Server を経由して Azure リソースを日本語で調査できる CLI エージェント"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "shinyay", email = "shinya.com@gmail.com"}
]
keywords = ["azure", "mcp", "agent", "cli", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "agent-framework",
    "agent-framework-azure-ai",
    "azure-identity",
    "openai",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
azure-mcp-agent = "azure_mcp_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
